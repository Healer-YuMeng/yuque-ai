services:
  backend:
    image: "${SERVER_DOCKER_REGISTRY:-youwei.tencentcloudcr.com}/${SERVER_DOCKER_NAMESPACE:-yuque-rag-demo}/${BACKEND_IMAGE_NAME:-yuque-rag-demo-backend}:${IMAGE_TAG:-latest}"
    container_name: yuque-rag-demo-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 8000
      FRONTEND_PORT: "${HTTPS_PORT:-443}"
      LLM_PROVIDER: "${LLM_PROVIDER:-openai}"
      LLM_MODEL: "${LLM_MODEL:-qwen3.7-plus}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
      DASHSCOPE_BASE_URL: "${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
      INTENT_LLM_MODEL: "${INTENT_LLM_MODEL:-qwen3.7-plus}"
      ASSISTANT_META_ROUTER_MODEL: "${ASSISTANT_META_ROUTER_MODEL:-qwen3.7-plus}"
      VISION_MODEL: "${VISION_MODEL:-qwen3.7-plus}"
      VISION_BASE_URL: "${VISION_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
      YUQUE_MCP_COMMAND: npx
      YUQUE_MCP_ARGS: "${YUQUE_MCP_ARGS:-}"
    volumes:
      - backend_data:/app/data_runtime
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    image: "${SERVER_DOCKER_REGISTRY:-youwei.tencentcloudcr.com}/${SERVER_DOCKER_NAMESPACE:-yuque-rag-demo}/${FRONTEND_IMAGE_NAME:-yuque-rag-demo-frontend}:${IMAGE_TAG:-latest}"
    container_name: yuque-rag-demo-frontend
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: "${PUBLIC_DOMAIN:-educhat.youwei-ai.com}"
      TLS_CERT_PATH_IN_CONTAINER: /etc/nginx/certs/fullchain.pem
      TLS_KEY_PATH_IN_CONTAINER: /etc/nginx/certs/privkey.pem
    volumes:
      - "${TLS_CERT_PATH:-./deploy/certs/fullchain.pem}:/etc/nginx/certs/fullchain.pem:ro"
      - "${TLS_KEY_PATH:-./deploy/certs/privkey.pem}:/etc/nginx/certs/privkey.pem:ro"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<NGINX
        server {
          listen 80;
          listen [::]:80;
          server_name $${PUBLIC_DOMAIN};
          return 301 https://$${PUBLIC_DOMAIN}$$request_uri;
        }

        server {
          listen 443 ssl;
          listen [::]:443 ssl;
          http2 on;
          server_name $${PUBLIC_DOMAIN};
          client_max_body_size 500m;

          ssl_certificate $${TLS_CERT_PATH_IN_CONTAINER};
          ssl_certificate_key $${TLS_KEY_PATH_IN_CONTAINER};
          ssl_session_timeout 10m;
          ssl_session_cache shared:SSL:10m;
          ssl_protocols TLSv1.2 TLSv1.3;
          ssl_prefer_server_ciphers on;

          root /usr/share/nginx/html;
          index index.html;

          location / {
            try_files $$uri $$uri/ /index.html;
          }

          location = /visitor {
            try_files /index.html =404;
          }

          location ~ ^/(chat|docs|mcp|yuque)(/|$$) {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
          }

          location ~ ^/(health|runtime-mode|dev-links)(/|$$) {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
          }

          location ~ ^/visitor/(profile|trial)(/|$$) {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
          }

          location ~ ^/(admin-api|admin-media)(/|$$) {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_read_timeout 3600s;
          }
        }
        NGINX

        nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  backend_data:
