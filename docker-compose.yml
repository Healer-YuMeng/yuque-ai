services:
  backend:
    image: "${SERVER_DOCKER_REGISTRY:-youwei.tencentcloudcr.com}/${SERVER_DOCKER_NAMESPACE:-yuque-rag-demo}/${BACKEND_IMAGE_NAME:-yuque-rag-demo-backend}:${IMAGE_TAG:-latest}"
    container_name: yuque-rag-demo-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 8000
      FRONTEND_PORT: "${FRONTEND_PORT:-18080}"
      LLM_PROVIDER: "${LLM_PROVIDER:-openai}"
      LLM_MODEL: "${LLM_MODEL:-qwen3.6-plus}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
      DASHSCOPE_BASE_URL: "${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
      INTENT_LLM_MODEL: "${INTENT_LLM_MODEL:-qwen3.6-plus}"
      ASSISTANT_META_ROUTER_MODEL: "${ASSISTANT_META_ROUTER_MODEL:-qwen3.6-plus}"
      VISION_MODEL: "${VISION_MODEL:-qwen3.6-plus}"
      VISION_BASE_URL: "${VISION_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
    volumes:
      - backend_data:/app/data_runtime
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    image: "${SERVER_DOCKER_REGISTRY:-youwei.tencentcloudcr.com}/${SERVER_DOCKER_NAMESPACE:-yuque-rag-demo}/${FRONTEND_IMAGE_NAME:-yuque-rag-demo-frontend}:${IMAGE_TAG:-latest}"
    container_name: yuque-rag-demo-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-18080}:80"
    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'NGINX'
        server {
          listen 80;
          server_name _;

          root /usr/share/nginx/html;
          index index.html;

          location / {
            try_files $$uri $$uri/ /index.html;
          }

          location = /visitor {
            try_files /index.html =404;
          }

          location ~ ^/(chat|docs|mcp|yuque)(/|$$) {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
          }

          location ~ ^/(health|runtime-mode|dev-links)(/|$$) {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
          }

          location ~ ^/visitor/(profile|trial)(/|$$) {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
          }
        }
        NGINX

        nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  backend_data:
